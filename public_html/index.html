<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Calificaciones</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="contenedor">

        <h1>Sistema de Calificaciones</h1>

        <p>Captura las calificaciones del alumno</p>

        <div class="formulario">

            <label for="nombre">Nombre del alumno:</label>
            <input type="text" id="nombre" placeholder="Escribe el nombre">
            
            <!--Agregamos un nuevo campo que es la edad -->
            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="0" placeholder="Escribe la edad">


            <label for="calificacion1">Calificación 1:</label>
            <input type="number" id="calificacion1" min="0" max="10">

            <label for="calificacion2">Calificación 2:</label>
            <input type="number" id="calificacion2" min="0" max="10">

            <label for="calificacion3">Calificación 3:</label>
            <input type="number" id="calificacion3" min="0" max="10">
            <!--Podemos ingresar una nueva calificacion aqui -->
            <label for="calificacion4">Calificación 4:</label>
            <input type="number" id="calificacion4" min="0" max="10">

            <button onclick="calcularPromedio()">
                Calcular promedio
            </button>

            <!-- Boton nuevo: agrega el alumno a la matriz "alumnos" -->
            <button onclick="agregarAlumno()">
                Agregar alumno
            </button>

            <!-- Boton nuevo: limpia el formulario -->
            <button onclick="limpiarFormulario()">
                Limpiar
            </button>   

        </div>

        <div id="resultado" class="resultado">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
